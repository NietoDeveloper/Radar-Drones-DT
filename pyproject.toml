[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdt-drone-radar"
version = "1.0.0"
description = "Python backend for radar-based drone detection: ingestion, multi-sensor tracking, micro-Doppler classification, alerting, recording and a REST/WebSocket API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - SoftwareDT.com" }
authors = [{ name = "SoftwareDT.com" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.5",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "websockets>=12", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
sdt-radar = "sdt_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sdt_radar = ["classification/models/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["B008", "N818"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E702", "E741", "N806", "N803", "SIM115", "SIM117", "B017"]
